name: Path Trigger Workflow
on: [workflow_dispatch]

jobs:
  path-job:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: srcディレクトリ内のファイル確認
        run: |
          echo "=== src/sample.txt の中身を出力します ==="
          # src/sample.txt が存在しない場合のエラーを防ぐため、存在チェックを入れて安全にしています
          if [ -f src/sample.txt ]; then
            cat src/sample.txt
          else
            echo "エラー: src/sample.txt が見つかりません。フォルダ名が src になっているか確認してください。"
          fi
